<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tune Tune</title>
  <meta name="description" content="Tune Tune — a free music player. Trending songs, live radio from around the world, synced lyrics, an equalizer and offline downloads. No account, no ads.">
  <meta name="theme-color" content="#ffffff">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tune Tune">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <nav id="tabs" aria-label="Main"></nav>
    <main id="view" tabindex="-1"></main>
    <div id="mini" data-a="opennp" role="button" aria-label="Open Now Playing"></div>
  </div>

  <section id="np" aria-label="Now Playing"></section>
  <div id="sheet"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <input type="file" id="f-audio" accept="audio/*,.mp3,.m4a,.aac,.flac,.wav,.ogg,.opus" multiple hidden>
  <input type="file" id="f-backup" accept="application/json,.json" hidden>

  <script src="app.js"></script>
</body>
</html>
