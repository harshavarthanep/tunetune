# Builds the Android, Windows, macOS and Linux apps for free on GitHub and publishes them as a Release.
# Run it from the repo's Actions tab: "Build apps" → Run workflow.
# Download links afterwards (they always point to the newest build):
#   https://github.com/<you>/<repo>/releases/latest/download/TuneTune.apk
#   https://github.com/<you>/<repo>/releases/latest
name: Build apps
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npm run android:prepare
      - run: npx cap add android
      - run: npm run android:setup
      - run: npx cap sync android
      - name: Use the fixed signing key (so updates install over the old app)
        run: |
          mkdir -p ~/.android
          cp build/debug.keystore ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android >/dev/null 2>&1 || { echo "Keystore unreadable, using a fresh one"; rm -f ~/.android/debug.keystore; }
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk TuneTune.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TuneTune-Android
          path: TuneTune.apk

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Give the installer a simple name
        shell: bash
        run: |
          cd dist
          for f in *.exe; do [ -f "$f" ] && mv "$f" ../TuneTune-Windows.exe; done
          for f in *.dmg; do [ -f "$f" ] && mv "$f" ../TuneTune-macOS.dmg; done
          for f in *.AppImage; do [ -f "$f" ] && mv "$f" ../TuneTune-Linux.AppImage; done
          true
      - uses: actions/upload-artifact@v4
        with:
          name: TuneTune-${{ runner.os }}
          path: |
            TuneTune-Windows.exe
            TuneTune-macOS.dmg
            TuneTune-Linux.AppImage
          if-no-files-found: ignore

  release:
    needs: [android, desktop]
    if: always() && needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Tune Tune (build ${{ github.run_number }})
          make_latest: true
          body: |
            **Android:** download TuneTune.apk and open it on your phone (allow "Install unknown apps" once).
            **Windows:** TuneTune-Windows.exe · **Mac:** TuneTune-macOS.dmg · **Linux:** TuneTune-Linux.AppImage
          files: out/*
